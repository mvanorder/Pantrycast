[project]
name = "pantrycast"
version = "0.1.0"
description = "FastAPI backend for Pantrycast"
requires-python = ">=3.12"
dependencies = [
    "fastapi~=0.141.1",
    "uvicorn[standard]>=0.52.3,<0.54.0",
    "python-dotenv~=1.2.2",
    "python-multipart~=0.0.32",
    "sqlalchemy[asyncio]~=2.0.52",
    "asyncpg~=0.31.0",
    "alembic>=1.19.1,<1.21.0",
    "pydantic-settings~=2.15.0",
    "argon2-cffi>=23.1,<25.2",
    "pyjwt[crypto]>=2.13,<2.15",
    "pydantic[email]>=2.13.4",
    "aiosmtplib>=4,<6",
]

[project.scripts]
serve = "app.main:run"
test = "pytest:console_main"
migrate = "alembic.config:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio~=1.0",
    "pytest-cov~=7.1.0",
    "httpx2>=2.12,<2.14",
    "ruff~=0.14",
    "mypy>=1.18,<3.0",
    "pylint~=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends(...)/Query(...)/etc. as argument defaults is the
# documented idiom, not the mutable-default-argument bug this rule targets.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"

[tool.pylint.main]
py-version = "3.12"
# alembic/: `op.*`/`context.*` are populated dynamically at runtime (pylint's
# static analysis can't see them, hence spurious no-member errors), and
# generated migrations' revision/down_revision/etc. identifiers are lowercase
# because Alembic's own tooling requires that exact name, not a style choice.
ignore-paths = ["^alembic[/\\\\].*$"]

[tool.pylint.format]
max-line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
minversion = "8.0"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=90"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
# `if TYPE_CHECKING:` blocks hold import-only-for-typing statements that never
# run at runtime (e.g. cross-module ORM relationship forward refs) — excluding
# them keeps a purely-typing import from counting as a coverage miss.
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]

[tool.coverage.html]
directory = "htmlcov"
