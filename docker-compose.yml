# Base service definition shared by every environment. Never run alone —
# combine with one env override, e.g.:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  db:
    build:
      context: ./database
    image: pantrycast-db:local
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    # POSTGRES_USER/POSTGRES_DB come from each overlay's env_file, not from
    # here: an `environment:` entry always outranks `env_file:` for the same
    # service, so a hardcoded default here would silently override whatever
    # .env.dev/.env.staging/.env.prod actually set. Read them from the
    # container's own runtime env instead of interpolating host-side, for the
    # same reason.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pantrycast

  backend:
    build:
      context: ./backend
    image: pantrycast-backend:local
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pantrycast

  # Wolfi-based Nginx: the frontend host and the reverse proxy in front of the
  # backend (proxy/Dockerfile, docs/design/uac-design.md §6/§7). The `static`
  # target here bakes the Expo web export into the image and serves it from
  # disk; docker-compose.dev.yml swaps to the `dev` target, which instead
  # reverse-proxies to a live `frontend` container. Backend routes are
  # reverse-proxied in every environment.
  proxy:
    build:
      context: .
      dockerfile: proxy/Dockerfile
      target: static
      args:
        # Public base URL the web app resolves API calls against, inlined into
        # the bundle at build time. Same-origin by default (empty) so calls go
        # to this proxy and through the reverse-proxy rules; override per
        # environment. Compose reads this from the shell env or the root .env.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-}
    image: pantrycast-proxy:local
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pantrycast

networks:
  pantrycast:
    driver: bridge
