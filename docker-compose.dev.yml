# Dev: plain password via env file, port published to the host so local
# tools (psql, DBeaver, etc.) can connect directly, disposable volume.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The app is served at http://localhost:8080 (the proxy). It reverse-proxies
# backend routes to `backend` and everything else to the `frontend` container
# running `expo start`, so hot reload works through the proxy. The backend is
# also still published on :8000 for direct curl/docs access.
services:
  db:
    env_file:
      - .env.dev
    ports:
      - "5432:5432"
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    restart: "no"

  backend:
    env_file:
      - .env.dev
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    ports:
      - "8000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: "no"

  # Expo web dev server. Only exists in dev — staging/prod bake the static
  # export into the proxy image instead. Metro is published on :8081 too so
  # the browser can reach the HMR websocket directly if needed.
  frontend:
    build:
      context: ./frontend
      target: dev
    image: pantrycast-frontend:local
    environment:
      # Served through the proxy, so the web app talks to the proxy origin and
      # backend calls stay same-origin (no CORS). Metro advertises itself as
      # localhost so HMR URLs in the browser resolve.
      EXPO_PUBLIC_API_URL: "http://localhost:8080"
      REACT_NATIVE_PACKAGER_HOSTNAME: "localhost"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "8081:8081"
    # Must be on the same network the base file puts db/backend/proxy on —
    # otherwise `frontend` lands on compose's default network and the proxy
    # can't resolve it.
    networks:
      - pantrycast
    restart: "no"

  proxy:
    build:
      target: dev
    depends_on:
      frontend:
        condition: service_started
    ports:
      - "8080:8080"
    restart: "no"

  # Optional local SMTP catcher for testing the email flows (uac-design.md §1).
  # Off by default — the backend logs emails instead of sending when SMTP_HOST
  # is unset. To use it: uncomment this service, add SMTP_HOST=mailpit /
  # SMTP_PORT=1025 / SMTP_SECURITY=plaintext to .env.dev, and open the web
  # inbox at http://localhost:8025.
  # mailpit:
  #   image: axllent/mailpit:latest
  #   ports:
  #     - "1025:1025"
  #     - "8025:8025"
  #   networks:
  #     - shopping-analysis
  #   restart: "no"

volumes:
  db-data-dev:
