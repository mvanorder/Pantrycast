# Prod: no host port at all (single-server path from docs/design/uac-design.md
# — the backend container reaches this over the compose network); password
# from a Docker secret, not an env var, so it never shows up in `docker
# inspect` or process listings.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Cloud path: this file is for the single-server deployment. On Cloud
# Run/ECS, use managed Postgres (Cloud SQL / RDS) instead of this service —
# see "The migration path between them" in docs/design/uac-design.md.
services:
  db:
    env_file:
      - .env.prod
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - db-data-prod:/var/lib/postgresql/data
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  backend:
    env_file:
      - .env.prod
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
    secrets:
      - postgres_password
      - smtp_password
    ports:
      - "8000:8000"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # Serves the baked Expo web export and reverse-proxies the backend. The
  # app's entry point; the TLS-terminating reverse proxy (Caddy/Traefik, not
  # yet built — see docs/design/uac-design.md §7) sits in front of :8080.
  proxy:
    build:
      target: static
      args:
        # Must be the public base URL prod is reached at — inlined into the
        # web bundle at build time. Export it before `docker compose build`.
        EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:?set EXPO_PUBLIC_API_URL to the public prod URL before building}
    ports:
      - "8080:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

secrets:
  postgres_password:
    file: ./secrets/postgres_password_prod.txt
  smtp_password:
    file: ./secrets/smtp_password_prod.txt

volumes:
  db-data-prod:
