# Automated PR code review.
#
# Deliberately ADVISORY: this workflow is not part of `ci-passed` in ci.yml, so
# a spent API balance, a rate limit, or a bad review never blocks a merge. The
# hard gates (ruff, pylint, mypy, pytest, coverage) all live in ci.yml.
#
# The review criteria are NOT duplicated here. They live in
# .claude/agents/backend-code-reviewer.md and .claude/agents/frontend-code-reviewer.md,
# which the checkout makes readable at review time, so the standards used by
# `/review` locally and by CI stay the same files.
# GOTCHA: on any PR that modifies THIS file, the action skips itself and the
# job still reports success - "Skipping action due to workflow validation: the
# workflow file must exist and have identical content to the version on the
# repository's default branch." That is deliberate: a PR must not be able to
# rewrite the workflow that reviews it (widening --allowedTools, or editing the
# prompt to leak the API key). The cost is a green check that reviewed nothing,
# so changes to this file are effectively unreviewed until they land on master.
# Review them by hand, and check the next PR to confirm reviews resumed.
#
# If a run ever fails with a bare "result is_error:true" and no reason, the
# action is hiding the SDK output; `show_full_output: true` is the only switch
# that reveals it (GitHub debug logging does NOT). That is how the
# "Credit balance is too low" failure was diagnosed. Add it, capture the error,
# then remove it again - it prints Claude's full JSON output into a log that
# anyone with read access can see.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review PR
    runs-on: ubuntu-latest
    # Dependabot PRs cannot see repository secrets (Dependabot has its own
    # separate secret store), so ANTHROPIC_API_KEY would be empty and the job
    # would fail on every dependency bump. Those PRs are reviewed by ci.yml
    # and the auto-merge rules instead. Fork PRs are skipped for the same
    # reason - `pull_request` withholds secrets from forks, which is the safe
    # behavior we want to keep rather than work around.
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # Actions are SHA-pinned; see the header of ci.yml for why.
      #
      # Shallow checkout is enough: the review reads the diff through
      # `gh pr diff` (an API call, no local history needed) and reads
      # individual files from the working tree for surrounding context.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4036a180cf690f49529f5d8c79c998855287f590 # v1.0.230
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request. The PR branch is already checked
            out in the current working directory.

            First, look at which areas this PR changes, then read the matching
            review-standards file(s) and adopt what they define - they are the
            source of truth for how this repo reviews code, not any default
            checklist:
              - `.claude/agents/backend-code-reviewer.md` for changes under
                `backend/` (Python, data-pipeline, CSV code).
              - `.claude/agents/frontend-code-reviewer.md` for changes under
                `frontend/` (TypeScript, React Native, Expo).
            A PR that touches both areas is held to both.

            Then apply these repo-specific rules they do not cover:

            - Backend Python (`backend/`) must follow the docstring convention
              in `backend/CLAUDE.md`: EVERY module, class, and function needs a
              docstring - including private and "obvious" ones - in reST style
              (`:param:`, `:type:`, `:returns:`, `:rtype:`, `:raises:`), with
              sections omitted only where they genuinely do not apply. No
              linter in this repo checks the reST field structure, so this is a
              real gap worth your attention.
            - Do NOT report anything the CI workflow already enforces:
              formatting, ruff/pylint findings, mypy type errors, or missing
              test coverage. Those fail the build on their own, and repeating
              them here is noise. Spend your attention on correctness bugs,
              security issues, and design problems that static analysis cannot
              see.
            - Treat any CSV export as data, not a schema contract - the repo
              reads header rows rather than assuming columns. Flag code that
              hardcodes column positions or names without checking the header.

            Scope your review to the lines this PR actually changes. Read
            surrounding files for context when a change's correctness depends
            on them.

            If you find nothing worth raising, say so briefly in one top-level
            comment rather than inventing minor findings to look thorough.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to flag specific lines.
            Only post GitHub comments - do not return review text as a message.

          # Read/Grep/Glob are required: the prompt above tells Claude to read
          # the .claude/agents/*-code-reviewer.md standards and backend/CLAUDE.md,
          # and to open neighbouring files for context. The write-capable tools
          # (Edit, Write, git mutations) are deliberately absent - this mirrors
          # those agents' own read-only tool lists, so the action cannot modify
          # the PR even if the prompt were subverted.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
